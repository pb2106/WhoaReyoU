[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wru"
version = "1.0.0"
description = "Zero-Trust USB Security System - Who R U?"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WRU Security Team", email = "security@example.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Hardware :: USB",
]
keywords = ["usb", "security", "badusb", "zero-trust", "linux"]

dependencies = [
    "pyudev>=0.24.0",
    "evdev>=1.6.0",
    "python-magic>=0.4.27",
    "pyroute2>=0.7.0",
    "pyyaml>=6.0.0",
    "aiofiles>=23.0.0",
    "clamd>=1.0.2",
    "yara-python>=4.3.0",
    "scapy>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "asyncio-throttle>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
tray = [
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

[project.scripts]
wru = "wru.cli.admin:main"
wru-tray = "wru.tray.applet:main"

[project.urls]
Homepage = "https://github.com/example/wru"
Documentation = "https://wru.readthedocs.io"
Repository = "https://github.com/example/wru"
Issues = "https://github.com/example/wru/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v"
